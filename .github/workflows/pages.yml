name: Deploy Pages

# Publishes docs/ as the phone app. configure-pages turns Pages on by itself the
# first time this runs, which is the only way to enable it from a workflow.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let the running one land first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Live at ${{ steps.deployment.outputs.page_url }}"
