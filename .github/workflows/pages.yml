name: Deploy Pages

# Publishes docs/ as the phone app.
#
# This only runs once a human has enabled Pages in Settings -> Pages. Neither the
# dev environment nor a runner can do it: the REST path is blocked from the dev
# proxy, and a workflow GITHUB_TOKEN gets 403 "Resource not accessible by
# integration" on both POST /pages and the environment's branch policies, even
# with pages:write. Enabling Pages needs repo-admin rights, which GITHUB_TOKEN
# never has.
#
# If you pick "GitHub Actions" as the source, this workflow is the deploy. If you
# pick "Deploy from a branch" (main, /docs), GitHub builds it itself and this
# workflow is redundant but harmless.
#
# One gotcha found the hard way: the github-pages environment was created with a
# deployment-branch policy allowing a single branch literally named "None", so
# every deploy was rejected before any step ran. If a deploy fails that way, fix
# it at Settings -> Environments -> github-pages -> Deployment branches.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let the running one land first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Live at ${{ steps.deployment.outputs.page_url }}"
