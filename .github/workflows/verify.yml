name: Verify
# One-shot: is the APK actually downloadable from the site, with the headers a
# phone needs? github.io is unreachable from the dev container, so this asks
# from a runner. Delete once answered.
on: {workflow_dispatch: {}}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: The site's own download
        run: |
          set -euo pipefail
          SITE=https://predatuh.github.io/EdgeBot
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"
          for p in "" get.html gridiron-ticket.apk; do
            echo "--- /$p"
            curl -sS -m 90 -A "$UA" -D /tmp/h -o /tmp/b -L -w "FINAL %{http_code}  %{size_download} bytes  %{time_total}s  hops:%{num_redirects}\n" "$SITE/$p"
            tr -d '\r' < /tmp/h | grep -iE '^(HTTP|content-type|content-length|location)' || true
          done
          echo "--- is it the same APK the release has?"
          curl -sS -m 120 -A "$UA" -L -o /tmp/site.apk "$SITE/gridiron-ticket.apk"
          curl -sS -m 120 -A "$UA" -L -o /tmp/rel.apk "https://github.com/Predatuh/EdgeBot/releases/latest/download/gridiron-ticket.apk"
          sha256sum /tmp/site.apk /tmp/rel.apk
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("/tmp/site.apk")
          h = z.read("assets/index.html")
          print("installable zip:", "classes.dex" in z.namelist())
          print("carries the Paper tab:", b'data-tab="paper"' in h)
          print("bytes:", len(open("/tmp/site.apk","rb").read()))
          PY
