name: Verify
on: {workflow_dispatch: {}}
permissions: {contents: read, pages: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}"}
        run: |
          URL=$(gh api "repos/$R/pages" --jq .html_url)
          echo "site: $URL"
          gh api "repos/$R/pages" --jq '{status,build_type,source}'
          echo "--- latest Pages build"
          gh api "repos/$R/pages/builds/latest" --jq '{status,created_at,error}' || true
          echo "--- serving:"
          for p in "" "manifest.webmanifest" "icon-512.png"; do
            printf '  /%-22s HTTP %s\n' "${p:-(index)}" "$(curl -s -o /tmp/o -w '%{http_code}' -L "$URL$p")"
          done
          curl -sL "$URL" -o /tmp/p.html
          echo "--- is the live page the current build?"
          for w in 'data-tab="stats"' 'Does the model beat the price' 'Target payout' 'raw.githubusercontent.com'; do
            grep -q "$w" /tmp/p.html && echo "  ok   $w" || echo "  MISSING  $w"
          done
          echo "--- feeds the app pulls"
          for f in parlay stats; do
            printf '  %-8s HTTP %s\n' "$f.json" "$(curl -s -o /tmp/$f.json -w '%{http_code}' https://raw.githubusercontent.com/$R/main/data/v2/$f.json)"
          done
          python3 -c "import json;d=json.load(open('/tmp/stats.json'));r=d['top_ratings']['ncaaf'];print('  ncaaf top:',r[0]['name'],round(r[0]['elo']),'| spread',round(r[0]['elo']-r[-1]['elo']))"
