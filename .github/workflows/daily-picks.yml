name: Daily Picks

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - records-only
          - test-webhooks

permissions:
  contents: write

concurrency:
  group: edgebot-daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh EPA
        if: ${{ github.event.inputs.mode != 'records-only' && github.event.inputs.mode != 'test-webhooks' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true
        run: python epa.py --league nfl,ncaaf

      - name: Run EdgeBot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_NCAAF: ${{ secrets.DISCORD_WEBHOOK_NCAAF }}
          DISCORD_WEBHOOK_NFL: ${{ secrets.DISCORD_WEBHOOK_NFL }}
          DISCORD_WEBHOOK_MLB: ${{ secrets.DISCORD_WEBHOOK_MLB }}
          DISCORD_WEBHOOK_EPL: ${{ secrets.DISCORD_WEBHOOK_EPL }}
          DISCORD_WEBHOOK_LALIGA: ${{ secrets.DISCORD_WEBHOOK_LALIGA }}
          DISCORD_WEBHOOK_SERIEA: ${{ secrets.DISCORD_WEBHOOK_SERIEA }}
          DISCORD_WEBHOOK_BUNDESLIGA: ${{ secrets.DISCORD_WEBHOOK_BUNDESLIGA }}
          DISCORD_WEBHOOK_UCL: ${{ secrets.DISCORD_WEBHOOK_UCL }}
          DISCORD_WEBHOOK_MLS: ${{ secrets.DISCORD_WEBHOOK_MLS }}
          DISCORD_WEBHOOK_TENNIS: ${{ secrets.DISCORD_WEBHOOK_TENNIS }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          DISCORD_WEBHOOK_STRONG: ${{ secrets.DISCORD_WEBHOOK_STRONG }}
          DISCORD_WEBHOOK_RECORDS: ${{ secrets.DISCORD_WEBHOOK_RECORDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "records-only" ]; then
            python main.py --grade-only --days=1
          elif [ "$MODE" = "test-webhooks" ]; then
            python -c "
import notify
for key in ['NCAAF','NFL','MLB','EPL','LALIGA','SERIEA','BUNDESLIGA','UCL','MLS','TENNIS','OTHER','STRONG','RECORDS']:
    notify.post(f'Test message for {key}', webhook_key=key)
"
          else
            python main.py
          fi

      - name: Commit updated ratings + pick log
        if: ${{ github.event.inputs.mode != 'test-webhooks' }}
        run: |
          git config user.name "edgebot"
          git config user.email "edgebot@users.noreply.github.com"
          python merge_state.py
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push || (git pull --rebase -X theirs origin main && git push)
