name: Daily Picks

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs write data/ at the same time (that's what caused the
# rebase conflicts earlier); a second trigger just waits its turn.
concurrency:
  group: edgebot-daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run EdgeBot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
      - name: Commit updated ratings + pick log
        run: |
          git config user.name "edgebot"
          git config user.email "edgebot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          # data/ files are regenerated every run, so on a conflict this run's copy wins
          # (during a rebase "theirs" is the commit being replayed, i.e. ours).
          git pull --rebase -X theirs origin main
          git push || (git pull --rebase -X theirs origin main && git push)
