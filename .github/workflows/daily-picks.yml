name: Daily Picks

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: edgebot-daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh EPA
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true
        run: python epa.py --league nfl,ncaaf

      - name: Run EdgeBot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_NCAAF: ${{ secrets.DISCORD_WEBHOOK_NCAAF }}
          DISCORD_WEBHOOK_NFL: ${{ secrets.DISCORD_WEBHOOK_NFL }}
          DISCORD_WEBHOOK_MLB: ${{ secrets.DISCORD_WEBHOOK_MLB }}
          DISCORD_WEBHOOK_EPL: ${{ secrets.DISCORD_WEBHOOK_EPL }}
          DISCORD_WEBHOOK_LALIGA: ${{ secrets.DISCORD_WEBHOOK_LALIGA }}
          DISCORD_WEBHOOK_SERIEA: ${{ secrets.DISCORD_WEBHOOK_SERIEA }}
          DISCORD_WEBHOOK_BUNDESLIGA: ${{ secrets.DISCORD_WEBHOOK_BUNDESLIGA }}
          DISCORD_WEBHOOK_UCL: ${{ secrets.DISCORD_WEBHOOK_UCL }}
          DISCORD_WEBHOOK_MLS: ${{ secrets.DISCORD_WEBHOOK_MLS }}
          DISCORD_WEBHOOK_TENNIS: ${{ secrets.DISCORD_WEBHOOK_TENNIS }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          DISCORD_WEBHOOK_STRONG: ${{ secrets.DISCORD_WEBHOOK_STRONG }}
          DISCORD_WEBHOOK_RECORDS: ${{ secrets.DISCORD_WEBHOOK_RECORDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python main.py
      - name: Commit updated ratings + pick log
        run: |
          git config user.name "edgebot"
          git config user.email "edgebot@users.noreply.github.com"
          python merge_state.py
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push || (git pull --rebase -X theirs origin main && git push)
