name: Daily Picks

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run EdgeBot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.main
      - name: Commit updated ratings + pick log
        run: |
          git config user.name "edgebot"
          git config user.email "edgebot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git push
