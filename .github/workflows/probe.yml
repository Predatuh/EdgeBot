name: Probe
# One-shot: can a browser on a phone call Kalshi directly? The first attempt got
# 403 with curl's own User-Agent, which proves nothing about CORS - so this tries
# the four combinations that separate "the WAF hates curl" from "no CORS".
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Four requests, one variable at a time
        run: |
          API='https://api.elections.kalshi.com/trade-api/v2/markets?limit=1&status=open'
          BROWSER="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"
          BOT="EdgeBot/2"
          ORIGIN=https://predatuh.github.io
          probe () {
            echo "--- $1"
            shift
            curl -sS -D /tmp/h -o /tmp/b "$@" "$API" || echo "(curl failed)"
            tr -d '\r' < /tmp/h | grep -iE '^(HTTP|access-control|cf-|server:)' || echo "(no matching headers)"
            head -c 120 /tmp/b; echo; echo
          }
          probe "bot UA, no Origin   (what the workflows already do)" -H "User-Agent: $BOT" -H "Accept: application/json"
          probe "bot UA, with Origin (does an Origin alone get refused?)" -H "User-Agent: $BOT" -H "Accept: application/json" -H "Origin: $ORIGIN"
          probe "browser UA, no Origin" -H "User-Agent: $BROWSER" -H "Accept: application/json"
          probe "browser UA + Origin  (what the phone would actually send)" -H "User-Agent: $BROWSER" -H "Accept: application/json" -H "Origin: $ORIGIN" -H "Referer: $ORIGIN/"
          echo "--- OPTIONS preflight, browser UA"
          curl -sS -D /tmp/h4 -o /dev/null -X OPTIONS -H "User-Agent: $BROWSER" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" "$API" || true
          tr -d '\r' < /tmp/h4 | grep -iE '^(HTTP|access-control|allow)' || echo "(no matching headers)"
