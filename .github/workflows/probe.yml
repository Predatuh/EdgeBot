name: Probe
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["probe_espn.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python probe_espn.py
