<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridiron Ticket</title>
<meta name="theme-color" content="#080C10">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #080C10; color: #EAF2F6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100dvh; display: grid; place-items: center; padding: 28px 22px
    calc(28px + env(safe-area-inset-bottom)); text-align: center; }
  h1 { font-size: 1.35rem; letter-spacing: -.02em; margin: 0 0 8px; }
  p { margin: 0 auto 18px; max-width: 22rem; color: #9BB0BB; line-height: 1.5; font-size: .95rem; }
  button { appearance: none; border: 0; border-radius: 12px; min-height: 48px; padding: 0 22px;
    background: #F3B44A; color: #0E1419; font-weight: 800; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Need a connection</h1>
    <p>Gridiron Ticket is one live app on every phone. Reopen here once you’re online — same version as the web and iPhone.</p>
    <button type="button" onclick="try{GTHost.retry()}catch(e){location.reload()}">Try again</button>
  </div>
</main>
</body>
</html>
